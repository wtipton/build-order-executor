# Integration-test fixture: exercises EVERY step type and EVERY trigger type,
# run to completion against a (passive) real game. Not a strategy — a coverage
# probe. Asserted on via the [summary] stdout line (see tests/test_integration.py).
#
# Step types: build, train, warp, morph (warpgate + archon), research (x2),
#   hallucinate, chrono, send_probe, return_probe, rally, rally_and_transfer,
#   gas_workers, minerals_cap, workers (stop + start).
# Trigger types: time, supply, count, minerals, vespene.

name: All Schema Features

economy:
  continuous_workers: true
  minerals_per_base: 16

steps:
  - {at: {time: 5},   do: chrono, target: Nexus, note: "trigger:time + step:chrono"}
  - {at: {supply: 12}, do: build, what: Pylon, prewalk: {minerals: 90}, note: "trigger:supply + step:build + prewalk"}
  - {at: {count: {Pylon: 1}}, do: build, what: Gateway, note: "trigger:count"}
  - {at: {supply: 14}, do: send_probe, where: enemy_main, label: scout, note: "step:send_probe"}
  - {at: {time: 42},  do: build, what: Assimilator, note: "main gas 1"}
  - {at: {count: {Assimilator: 1}}, do: gas_workers, count: 3, note: "step:gas_workers"}
  - {at: {time: 50},  do: build, what: Nexus, note: "natural"}
  - {at: {count: {Gateway: 1}}, do: build, what: CyberneticsCore}
  - {at: {time: 60},  do: build, what: Pylon}
  - {at: {time: 68},  do: build, what: Assimilator, note: "main gas 2"}
  - {at: {count: {Assimilator: 2}}, do: gas_workers, count: 6}
  - {at: {supply: 20}, do: return_probe, label: scout, note: "step:return_probe"}
  - {at: {count: {Nexus: 2}}, do: rally_and_transfer, base: 2, note: "step:rally_and_transfer"}
  - {at: {count: {Nexus: 2}}, do: build, what: Assimilator, note: "natural gas 1"}
  - {at: {count: {Nexus: 2}}, do: build, what: Assimilator, note: "natural gas 2"}
  - {at: {count: {Assimilator: 4}}, do: gas_workers, count: 12}
  - {at: {count: {CyberneticsCore: 1}}, do: rally, where: natural, note: "step:rally"}
  - {at: {count: {CyberneticsCore: 1}}, do: research, what: Warpgate, note: "step:research #1"}
  - {at: {count: {CyberneticsCore: 1}}, do: chrono, target: CyberneticsCore, note: "chrono research"}
  - {at: {count: {CyberneticsCore: 1}}, do: train, what: Adept, note: "step:train"}
  - {at: {count: {CyberneticsCore: 1}}, do: train, what: Sentry, note: "for hallucinate"}
  - {at: {count: {CyberneticsCore: 1}}, do: build, what: Gateway, note: "2nd gateway"}
  - {at: {minerals: 350}, do: minerals_cap, count: 18, note: "trigger:minerals + step:minerals_cap"}
  - {at: {time: 130}, do: build, what: Pylon}
  - {at: {time: 150}, do: build, what: TwilightCouncil}
  - {at: {count: {TwilightCouncil: 1}}, do: build, what: TemplarArchive}
  - {at: {time: 175}, do: build, what: Pylon}
  - {at: {vespene: 120}, do: workers, state: stop, note: "trigger:vespene + step:workers stop"}
  - {at: {time: 200}, do: workers, state: start, note: "step:workers start"}
  - {at: {time: 210}, do: build, what: Pylon}
  - {at: {count: {Sentry: 1}}, do: hallucinate, note: "step:hallucinate (holds for 75 energy)"}
  - {at: {count: {TemplarArchive: 1}}, do: research, what: Storm, note: "step:research #2"}
  - {at: {count: {TemplarArchive: 1}}, do: chrono, target: TemplarArchive, note: "chrono Storm"}
  - {at: {count: {TemplarArchive: 1}}, do: train, what: HighTemplar, note: "HT 1"}
  - {at: {count: {TemplarArchive: 1}}, do: train, what: HighTemplar, note: "HT 2"}
  - {at: {time: 260}, do: build, what: Pylon}
  - {at: {count: {HighTemplar: 2}}, do: morph, to: archon, count: 1, note: "step:morph archon"}
  - {at: {count: {Gateway: 2}}, do: morph, to: warpgate, count: 1, note: "step:morph warpgate (needs Warpgate research)"}
  - {at: {count: {WarpGate: 1}}, do: warp, what: Zealot, where: main, note: "step:warp"}
