# Integration-test fixture: exercises (nearly) every step type and every trigger type,
# run to completion against a (passive) real game. Not a strategy — a coverage probe.
# Asserted on via the [summary] stdout line (see tests/test_integration.py).
#
# CROSS-VERSION: this one build must run identically on current retail AND the 4.10
# headless build. That rules out anything touching Warpgate: in 4.10, finishing Warpgate
# research AUTO-morphs every Gateway to a Warpgate (modern needs a manual morph), so
# `warp`, `morph warpgate`, AND `research Warpgate` all behave differently across versions.
# The fixture is therefore TRAIN-based and never researches Warpgate — Gateways stay
# Gateways in both, so every `train` step is valid.
#
# Step types: build, train, morph (archon), research (Storm), hallucinate, chrono,
#   send_probe, return_probe, set_rally_point, rally_and_transfer_probes, gas_workers, wait,
#   workers (stop + start). (warp / morph-warpgate / Warpgate research are version-
#   specific — omitted; see above.)
# Trigger types: time, supply, count, minerals, vespene.

- {at: {time: 5},   do: chrono, target: Nexus}  # trigger:time + step:chrono
- {at: {supply: 12}, do: build, what: Pylon, prewalk: {minerals: 90}}  # trigger:supply + step:build + prewalk
- {at: {count: {Pylon: 1}}, do: build, what: Gateway}  # trigger:count
- {at: {supply: 14}, do: send_probe, where: enemy_main, label: scout}  # step:send_probe
- {at: {time: 42},  do: build, what: Assimilator}  # main gas 1
- {at: {count: {Assimilator: 1}}, do: gas_workers, count: 3}  # step:gas_workers
- {at: {time: 50},  do: build, what: Nexus}  # natural
- {at: {count: {Gateway: 1}}, do: build, what: CyberneticsCore}
- {at: {time: 60},  do: build, what: Pylon}
- {at: {time: 68},  do: build, what: Assimilator}  # main gas 2
- {at: {count: {Assimilator: 2}}, do: gas_workers, count: 6}
- {at: {supply: 20}, do: return_probe, label: scout}  # step:return_probe
- {at: {count: {Nexus: 2}}, do: rally_and_transfer_probes, base: 2}  # step:rally_and_transfer_probes
- {at: {count: {Nexus: 2}}, do: build, what: Assimilator}  # natural gas 1
- {at: {count: {Nexus: 2}}, do: build, what: Assimilator}  # natural gas 2
- {at: {count: {Assimilator: 4}}, do: gas_workers, count: 12}
- {at: {count: {CyberneticsCore: 1}}, do: set_rally_point, where: natural}  # step:set_rally_point
- {at: {count: {CyberneticsCore: 1}}, do: train, what: Adept}  # step:train
- {at: {count: {CyberneticsCore: 1}}, do: train, what: Sentry}  # for hallucinate
- {at: {count: {CyberneticsCore: 1}}, do: build, what: Gateway}  # 2nd gateway
- {at: {minerals: 350}, do: wait}  # trigger:minerals + step:wait
- {at: {time: 130}, do: build, what: Pylon}
- {at: {time: 150}, do: build, what: TwilightCouncil}
- {at: {count: {TwilightCouncil: 1}}, do: build, what: TemplarArchive}
- {at: {time: 175}, do: build, what: Pylon}
- {at: {vespene: 120}, do: workers, state: stop}  # trigger:vespene + step:workers stop
- {at: {time: 200}, do: workers, state: start}  # step:workers start
- {at: {count: {Sentry: 1}}, do: hallucinate}  # step:hallucinate (holds for 75 energy)
- {at: {count: {TemplarArchive: 1}}, do: research, what: Storm}  # step:research #1
- {at: {count: {TemplarArchive: 1}}, do: chrono, target: TemplarArchive}  # chrono Storm
# Train the templar from Gateways (both game versions still have Gateways here —
# Warpgate isn't researched yet), then combine them into an Archon.
- {at: {count: {TemplarArchive: 1}}, do: train, what: HighTemplar}  # HT 1
- {at: {count: {TemplarArchive: 1}}, do: train, what: HighTemplar}  # HT 2
- {at: {time: 260}, do: build, what: Pylon}
- {at: {count: {HighTemplar: 2}}, do: morph, to: archon, count: 1}  # step:morph archon
