# Protoss 8-Worker Optimized: Fast 4-DT Warp Prism Drop into 3-Immortal Push + Charge & +1
#
# Timeline Targets:
#   ~2:50  Adept (chrono) -> Warpgate research -> Stalker (chrono)
#   ~3:15  Twilight Council -> Robotics Facility
#   ~3:45  Dark Shrine + 3 Gateways (4 total) + Pylons
#   ~4:20  Warp Prism (chrono) + 4 Warpgates ready
#   ~4:30  Warp 4 Dark Templars -> Morph 2 Archons -> Observer
#   ~4:50  3rd Nexus + Forge (+1 Weapons chrono) + Charge (chrono)
#   ~5:00  Immortal #1 (chrono) + Sentries
#   ~5:30  Immortal #2 (chrono) + Sentries + 4 Gateways (8 total)
#   ~6:00  Immortal #3 (chrono) -> 3-Immortal Moveout @ ~6:30 with +2 Weapons

# ===================== 1. Opener: 1-Gate Expand =====================
- {at: {time: 7},     do: chrono, target: Nexus}  # 1st chrono on probes (~6.5s)
- {at: {supply: 12},  do: build,  what: Pylon,   prewalk: {minerals: 75}}  # home Pylon=100
- {at: {supply: 12},  do: send_probe, where: enemy_main, who: scout}  # scout probe
- {at: {supply: 14},  do: build,  what: Gateway, prewalk: {minerals: 100}}  # 1st Gateway
- {at: {supply: 14},  do: chrono, target: Nexus}  # 2nd chrono at 50 energy
- {at: {supply: 15},  do: build,  what: Assimilator}  # main gas 1
- {at: {count: {Assimilator: 1}}, do: set_gas_probes, count: 1}
- {at: {count: {Probe: 17}}, do: set_gas_probes, count: 2}
- {at: {supply: 18},  do: cut_probes}  # for Nexus + Core + Gas 2
- {at: {supply: 18},  do: return_probe, who: scout}
- {at: {supply: 18},  do: build,  what: Nexus,   prewalk: {minerals: 300}}  # natural expansion (Nexus=400)
- {at: {supply: 18},  do: build,  what: Assimilator}  # main gas 2
- {at: {supply: 18},  do: build,  what: CyberneticsCore, prewalk: {minerals: 100}}
- {at: {supply: 18},  do: resume_probes}
- {at: {supply: 19},  do: set_gas_probes, count: 6}  # saturate both main gases
- {at: {supply: 20},  do: build,  what: Pylon, prewalk: {minerals: 75}}

# ===================== 2. Tech: Adept, Stalker, Warpgate, Twilight, Robo =====================
- {at: {count: {CyberneticsCore: 1}}, do: train, what: Adept}  # 1st unit: Adept
- {at: {count: {CyberneticsCore: 1}}, do: chrono, target: Gateway}  # chrono Adept
- {at: {count: {CyberneticsCore: 1}}, do: research, what: Warpgate}  # Warpgate research
- {at: {count: {CyberneticsCore: 1}}, do: build, what: TwilightCouncil, prewalk: {minerals: 100}}  # Twilight Council
- {at: {count: {CyberneticsCore: 1}}, do: train, what: Stalker}  # 2nd unit: Stalker
- {at: {count: {CyberneticsCore: 1}}, do: chrono, target: Gateway}  # chrono Stalker
- {at: {count: {CyberneticsCore: 1}}, do: build, what: RoboticsFacility, prewalk: {minerals: 100}}  # Robo Facility

# Transfer to natural once Nexus 2 finishes & take natural gases
- {at: {count: {Nexus: 2}}, do: rally_and_transfer_probes, where: natural}  # saturate natural
- {at: {count: {Nexus: 2}}, do: build, what: Assimilator, count: 2}  # natural gases 1-2
- {at: {count: {Nexus: 2}}, do: set_gas_probes, count: 12}  # saturate all 4 gases for DTs & tech

# ===================== 3. Dark Shrine, Gateways 2-4, Pylons =====================
- {at: {count: {TwilightCouncil: 1}}, do: build, what: DarkShrine, prewalk: {minerals: 100}}  # Dark Shrine
- {at: {count: {TwilightCouncil: 1}}, do: build, what: Pylon, where: natural}  # supply pylon
- {at: {count: {TwilightCouncil: 1}}, do: build, what: Gateway, prewalk: {minerals: 100}, count: 3}  # Gates 2-4
- {at: {count: {TwilightCouncil: 1}}, do: build, what: Pylon, where: natural, count: 2}  # supply pylons

# Cap probes at ~42 (2 saturated bases) for DT warpin & push tech
- {at: {count: {Probe: 42}}, do: cut_probes}  # cap probes at 42

# ===================== 4. Warp Prism + Morph 4 Warpgates =====================
- {at: {count: {RoboticsFacility: 1}}, do: train, what: WarpPrism}  # Warp Prism for DT drop
- {at: {count: {RoboticsFacility: 1}}, do: chrono, target: RoboticsFacility}  # chrono Warp Prism
- {at: {count: {Gateway: 1}}, do: morph, to: warpgate, count: 4}  # morph 4 Warpgates

# ===================== 5. 4 DT Warpin + Archon Morph =====================
- {at: {count: {DarkShrine: 1}}, do: warp, what: DarkTemplar, where: natural, count: 4}  # DTs 1-4
- {at: {count: {DarkTemplar: 4}}, do: morph, to: archon, count: 2}  # morph 2 Archons from DTs

# ===================== 6. Observer, 3rd Nexus, Forge, Charge =====================
- {at: {count: {WarpPrism: 1}}, do: train, what: Observer}  # Observer
- {at: {count: {DarkShrine: 1}}, do: build, what: Nexus, prewalk: {minerals: 350}}  # 3rd Nexus
- {at: {count: {DarkShrine: 1}}, do: build, what: Forge, prewalk: {minerals: 100}}  # Forge for +1 Weapons
- {at: {count: {DarkShrine: 1}}, do: build, what: Pylon, where: natural}

# ===================== 7. 3 Immortals (chrono x3) + Upgrades + Sentries =====================
- {at: {count: {Observer: 1}}, do: train, what: Immortal}  # Immortal #1
- {at: {count: {Observer: 1}}, do: chrono, target: RoboticsFacility}  # chrono Immortal 1
- {at: {count: {Forge: 1}}, do: research, what: GroundWeapons1}  # +1 Ground Weapons
- {at: {count: {Forge: 1}}, do: chrono, target: Forge}  # chrono +1 Weapons
- {at: {count: {TwilightCouncil: 1}}, do: research, what: Charge}  # Charge research
- {at: {count: {TwilightCouncil: 1}}, do: chrono, target: TwilightCouncil}  # chrono Charge
- {at: {count: {WarpGate: 1}}, do: warp, what: Sentry, where: natural, count: 2}  # Sentries 1-2

- {at: {count: {Immortal: 1}}, do: train, what: Immortal}  # Immortal #2
- {at: {count: {Immortal: 1}}, do: chrono, target: RoboticsFacility}  # chrono Immortal 2
- {at: {count: {WarpGate: 1}}, do: warp, what: Sentry, where: natural, count: 2}  # Sentries 3-4

- {at: {count: {Immortal: 2}}, do: train, what: Immortal}  # Immortal #3
- {at: {count: {Immortal: 2}}, do: chrono, target: RoboticsFacility}  # chrono Immortal 3
- {at: {count: {Nexus: 3}}, do: rally_and_transfer_probes, where: third}  # saturate 3rd base

# Additional production & supply for moveout
- {at: {count: {Immortal: 1}}, do: build, what: Pylon, where: third, count: 2}
- {at: {count: {Immortal: 1}}, do: build, what: Gateway, prewalk: {minerals: 100}, count: 4}  # Gates 5-8
- {at: {count: {Immortal: 1}}, do: morph, to: warpgate, count: 4}  # morph new gates
- {at: {count: {Immortal: 2}}, do: build, what: Pylon, where: third, count: 2}
- {at: {count: {Forge: 1}}, do: research, what: GroundWeapons2}  # +2 Ground Weapons
- {at: {count: {Immortal: 3}}, do: set_rally_point, where: natural}  # 3 Immortals ready - moveout!
- {at: {time: 500}, do: wait}  # hold for push
