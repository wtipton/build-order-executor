# Protoss vs Zerg (PvZ) opening for the 8-worker start (patch 5.0.16+)
# Source: "Beginner Protoss Opening - How to Play SC2 with 8 Worker Start"
#   https://www.youtube.com/watch?v=KeXt_5oBd50  (first ~4 min)
#
# Safe standard PvZ opening: expand + tech, Adept first. PvZ-specific — it
# rallies to the natural and (in the video) walls it; the PvT variant differs.
#
# The config schema is defined + validated in schema.py (pydantic).
#
# Patch facts / targets: 8 starting workers, Nexus = 13 supply, Adept out ~2:57.

- {at: {time: 7},   do: chrono, target: Nexus}  # 1st chrono on probes (~6.5s)
# A builder is pulled off the line as soon as we can afford the building. Add
# prewalk: {minerals: N} to send it EARLIER — once we'd have N minerals left AFTER
# paying for the probes still needed to reach the step's supply (so it can't fire
# early on a transient mineral spike). Pick N under the build's cost by roughly
# what the walk is worth.
- {at: {supply: 12},  do: build,  what: Pylon,   prewalk: {minerals: 75}}  # Pylon=100
- {at: {supply: 12},  do: send_probe, where: enemy_main, label: scout}  # poke-scout the enemy
- {at: {supply: 14},  do: build,  what: Gateway, prewalk: {minerals: 100}}  # Gateway=150
- {at: {supply: 14},  do: chrono, target: Nexus}  # 2nd chrono the moment Nexus hits 50 energy
- {at: {supply: 15},  do: build,  what: Assimilator}
- {at: {count: {Assimilator: 1}}, do: gas_workers,  count: 1}  # pull one one gas1
- {at: {count: {Probe: 17}}, do: gas_workers, count: 2}  # 17th probe -> gas
# cut probe production to bank Nexus (400) + Core (150), resume after Core.
- {at: {supply: 19},  do: workers, state: stop}  # cut probes for Nexus + Core
- {at: {supply: 19},  do: return_probe, label: scout}  # scout home to mining
- {at: {count: {Probe: 19}}, do: gas_workers, count: 3}  # 19th probe -> gas
# long walk to the natural, so give it a big lead: walk at 300 (Nexus=400).
- {at: {supply: 19},  do: build,  what: Nexus,   prewalk: {minerals: 300}}  # natural expansion (Nexus=400)
- {at: {supply: 19},  do: build,  what: CyberneticsCore}
- {at: {supply: 19},  do: workers, state: start}  # just one probe then small cut for pylon
- {at: {supply: 20},  do: workers, state: stop}
- {at: {supply: 20},  do: set_rally_point,  where: natural}
- {at: {supply: 20},  do: build,  what: Assimilator}
- {at: {supply: 20},  do: build,  what: Pylon}
- {at: {supply: 20},  do: workers, state: start}  # resume
- {at: {count: {Probe: 21}}, do: gas_workers, count: 4}
- {at: {count: {CyberneticsCore: 1}}, do: train,  what: Adept}  # out by ~2:57
- {at: {count: {CyberneticsCore: 1}}, do: chrono, target: Gateway}  # chrono the Adept
- {at: {count: {Probe: 22}}, do: gas_workers, count: 5}
- {at: {count: {Probe: 23}}, do: gas_workers, count: 6}
# once the natural finishes, transfer workers onto it and rally new probes there
- {at: {count: {Nexus: 2}}, do: rally_and_transfer_probes, base: 2}  # saturate the natural
