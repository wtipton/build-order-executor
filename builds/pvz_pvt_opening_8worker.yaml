# Protoss opening for the 8-worker start (patch 5.0.16+)
# Source: "Beginner Protoss Opening - How to Play SC2 with 8 Worker Start"
#   https://www.youtube.com/watch?v=KeXt_5oBd50  (first ~4 min)
#
# Safe standard PvZ/PvT opening: expand + tech, Adept first. (vs Zerg you also
# wall the natural — not modelled here.)
#
# This file is executed by bot.py. Two kinds of things live here:
#   steps:    the deliberate actions a human performs and must learn (build,
#             train, chrono, scout, rally, and economy overrides). Ordered.
#   economy:  defaults for the automatic economy the bot runs on its own
#             (continuous workers, no idle workers, minerals-then-gas saturation).
#
# Step schema:
#   at:   trigger — one of {supply: N} | {time: SECONDS} | {after: StructureName}
#   do:   build | train | chrono | scout | rally | gas_workers | minerals_cap | workers
#   ...:  action args (what / target / where / count / state)

name: Protoss 8-worker safe opening (PvZ/PvT)
race: Protoss
meta:
  start_workers: 8        # 5.0.16 reduced starting workers 12 -> 8
  nexus_supply: 13        # 5.0.16 reduced Nexus supply 15 -> 13
  adept_out_by: "2:57"

economy:
  continuous_workers: true   # always make probes unless a `workers: stop` step says not to
  minerals_per_base: 16      # saturate minerals to this per base, then fill gas
  gas_workers: 0             # starting desired gas count (steps ramp this up)

steps:
  - {at: {time: 7},   do: chrono, target: Nexus, note: "1st chrono on probes (~6.5s)"}
  # prewalk: {minerals: N} walks the builder once we'd have N minerals left AFTER
  # paying for the probes still needed to reach the step's supply (so it can't
  # fire early on a transient mineral spike). Pick N a bit under the build's cost.
  - {at: {supply: 12},  do: build,  what: Pylon,   prewalk: {minerals: 75},  note: "Pylon=100; builder then scouts"}
  - {at: {supply: 12},  do: scout}
  - {at: {supply: 14},  do: build,  what: Gateway, prewalk: {minerals: 100}, note: "Gateway=150"}
  - {at: {supply: 14},  do: chrono, target: Nexus, note: "2nd chrono the moment Nexus hits 50 energy"}
  - {at: {supply: 15},  do: build,  what: Assimilator}
  - {at: {supply: 15},  do: gas_workers, count: 1, note: "rally one worker into gas"}
  # long walk to the natural, so give it a big lead: walk at 300 (Nexus=400).
  - {at: {supply: 19},  do: build,  what: Nexus,   prewalk: {minerals: 300}, note: "natural expansion (Nexus=400)"}
  - {at: {supply: 19},  do: build,  what: CyberneticsCore}
  - {at: {supply: 19},  do: gas_workers, count: 2}
  - {at: {supply: 20},  do: build,  what: Assimilator}
  - {at: {supply: 20},  do: build,  what: Pylon}
  - {at: {supply: 20},  do: gas_workers, count: 6, note: "3 per geyser; 16 on minerals = fully mining"}
  - {at: {supply: 20},  do: rally,  where: natural}
  - {at: {after: CyberneticsCore}, do: train,  what: Adept,    note: "out by ~2:57"}
  - {at: {after: CyberneticsCore}, do: chrono, target: Gateway, note: "chrono the Adept"}

# Where the build branches after the opening (not executed; reference only).
branches:
  vs_zerg_or_macro: Stargate in main (cancel / never make Warpgate)
  vs_terran: Twilight Council + 2nd Gateway
  mineral_focused: skip the gas-heavy path, 2 Gateways early -> Blink

# Adjustment vs all-in early pool (e.g. 10-pool), from later in the video.
early_pool_adjustment:
  - chrono slightly earlier (~6s)
  - send the scouting probe a few seconds early (long walk to natural)
  - take first gas but hold it / commit no gas income early
