# Protoss vs Terran (PvT) economic opening for the 8-worker start (patch 5.0.16+)
#
# Structure: 12 Pylon, 14 Gateway, 18 Nexus, 18 Gas, 18 Core, 19 Gas, 20 Pylon.
# Both assimilators are saturated (3 each) as soon as they finish — expressed as a
# standing gas target of 6 (capacity-gated to 3 per ready gas), not a timed step.
#
# Standard opening extras added on top of the given structures: 2 probe chronos
# and a scout after the first Pylon.
#
# Schema defined + validated in schema.py.

- {at: {time: 7},     do: chrono, target: Nexus}  # 1st chrono on probes (~6.5s)
- {at: {supply: 12},  do: build,  what: Pylon,   prewalk: {minerals: 75}}  # Pylon=100
- {at: {supply: 14},  do: build,  what: Gateway, prewalk: {minerals: 100}}  # Gateway=150
- {at: {supply: 14},  do: send_probe, where: enemy_main, who: scout}  # poke-scout the enemy
- {at: {supply: 14},  do: chrono, target: Nexus}  # 2nd chrono the moment Nexus hits 50 energy
# cut probes at 18 to bank Nexus (400) + Gas (75) + Core (150) so all three land
# on 18; resume after the Core, then 2nd Gas (19) and Pylon (20) follow naturally.
- {at: {supply: 18},  do: workers, state: stop}  # cut for Nexus + Gas + Core
- {at: {supply: 18},  do: build,  what: Nexus,   prewalk: {minerals: 300}}  # natural expansion (Nexus=400)
- {at: {supply: 18},  do: build,  what: Assimilator}  # 1st gas
- {at: {supply: 18},  do: gas_workers, count: 6}  # fully saturate both gases (3 each) as they finish
- {at: {supply: 18},  do: build,  what: CyberneticsCore, prewalk: {minerals: 100}}  # Core=150
- {at: {supply: 18},  do: workers, state: start}  # resume probes
- {at: {supply: 18},  do: return_probe, who: scout}  # scout home to mining
- {at: {supply: 19},  do: build,  what: Assimilator}  # 2nd gas
- {at: {supply: 20},  do: build,  what: Pylon,   prewalk: {minerals: 75}}
# @core: 1st Stalker (chrono) + Warpgate, then Sentry, Twilight, 2nd Stalker, 2nd Gate, Pylon
- {at: {count: {CyberneticsCore: 1}}, do: train,    what: Stalker}  # 1st Stalker (chrono'd)
- {at: {count: {CyberneticsCore: 1}}, do: chrono,   target: Gateway}  # chrono the Stalker
- {at: {count: {CyberneticsCore: 1}}, do: research, what: Warpgate}
- {at: {count: {CyberneticsCore: 1}}, do: train,    what: Sentry}
- {at: {count: {CyberneticsCore: 1}}, do: build,    what: TwilightCouncil}
- {at: {count: {CyberneticsCore: 1}}, do: train,    what: Stalker}  # 2nd Stalker
- {at: {count: {CyberneticsCore: 1}}, do: build,    what: Gateway}  # 2nd Gateway
- {at: {count: {CyberneticsCore: 1}}, do: build,    what: Pylon}
# @twilight: Blink (chrono) + hallu (Sentry hallucinates a Phoenix, ~scout)
- {at: {count: {TwilightCouncil: 1}}, do: research, what: Blink}
- {at: {count: {TwilightCouncil: 1}}, do: chrono,   target: TwilightCouncil}  # chrono Blink
- {at: {count: {TwilightCouncil: 1}}, do: hallucinate}  # Sentry hallucinates a Phoenix
# once the natural finishes, transfer workers onto it and rally new probes there
- {at: {count: {Nexus: 2}}, do: rally_and_transfer_probes, where: natural}  # saturate the natural
