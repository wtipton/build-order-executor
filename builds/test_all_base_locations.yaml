# Regression fixture: exercise every named location. Expands to 6 bases and lets
# continuous workers populate all of them, then drops a Pylon at each named place —
# our bases (main..sixth) and the enemy/proxy spots (enemy_main, enemy_natural,
# proxy) — so location resolution, placement, and cross-map probe pathing are all
# exercised. Asserted via the [summary] `bases` (per-base workers) + census in
# tests/test_integration.py.

- {at: {time: 5},   do: chrono, target: Nexus}
- {at: {supply: 13}, do: build, what: Pylon}

# ===================== expand to 6 bases + populate each =====================
- {at: {count: {Nexus: 1}}, do: build, what: Nexus, prewalk: {minerals: 350}, note: "natural"}
- {at: {count: {Nexus: 2}}, do: rally_and_transfer_probes, base: 2}
- {at: {count: {Nexus: 2}}, do: build, what: Nexus, prewalk: {minerals: 350}, note: "third"}
- {at: {count: {Nexus: 3}}, do: rally_and_transfer_probes, base: 3}
- {at: {count: {Nexus: 3}}, do: build, what: Nexus, prewalk: {minerals: 350}, note: "fourth"}
- {at: {count: {Nexus: 4}}, do: rally_and_transfer_probes, base: 4}
- {at: {count: {Nexus: 4}}, do: build, what: Nexus, prewalk: {minerals: 350}, note: "fifth"}
- {at: {count: {Nexus: 5}}, do: rally_and_transfer_probes, base: 5}
- {at: {count: {Nexus: 5}}, do: build, what: Nexus, prewalk: {minerals: 350}, note: "sixth"}
- {at: {count: {Nexus: 6}}, do: rally_and_transfer_probes, base: 6}

# ===================== drop a Pylon at every named location =====================
- {at: {count: {Nexus: 6}}, do: build, what: Pylon, where: main}
- {at: {count: {Nexus: 6}}, do: build, what: Pylon, where: natural}
- {at: {count: {Nexus: 6}}, do: build, what: Pylon, where: third}
- {at: {count: {Nexus: 6}}, do: build, what: Pylon, where: fourth}
- {at: {count: {Nexus: 6}}, do: build, what: Pylon, where: fifth}
- {at: {count: {Nexus: 6}}, do: build, what: Pylon, where: sixth}
- {at: {count: {Nexus: 6}}, do: build, what: Pylon, where: enemy_main}
- {at: {count: {Nexus: 6}}, do: build, what: Pylon, where: enemy_natural}
- {at: {count: {Nexus: 6}}, do: build, what: Pylon, where: proxy}

# let continuous workers keep filling every base before we conclude
- {at: {time: 500}, do: wait, note: "wait for all 6 bases to populate"}
