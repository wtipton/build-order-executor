# Integration fixture: warp a unit in from a Warpgate. ONE build, valid on both current
# retail and the 4.10 headless build.
#
# The trick is the morph step: it's ordered right after `research Warpgate`, so it STARTS
# while the research is still in flight — capturing a baseline of 0 Warpgates. It then
# completes as soon as it sees the Gateway become a Warpgate, whether that happens because
# we issued the morph (modern: Gateways don't auto-convert) or because the research
# finishing auto-morphed it (the 4.10 mechanic). We never `train` a Gateway unit after
# this point, so the auto-morph removing the Gateway is fine.

- {at: {time: 5}, do: chrono, target: Nexus}
- {at: {supply: 13}, do: build, what: Pylon}
- {at: {count: {Pylon: 1}}, do: build, what: Gateway}
- {at: {time: 45}, do: build, what: Assimilator}
- {at: {count: {Assimilator: 1}}, do: gas_workers, count: 3}
- {at: {count: {Gateway: 1}}, do: build, what: CyberneticsCore}
- {at: {count: {CyberneticsCore: 1}}, do: research, what: Warpgate}
- {at: {count: {CyberneticsCore: 1}}, do: chrono, target: CyberneticsCore}
# Stop probes (so they don't keep refilling the cap) and add a second Pylon, so there's
# supply headroom for the Zealot we warp in.
- {at: {count: {CyberneticsCore: 1}}, do: workers, state: stop}
- {at: {count: {CyberneticsCore: 1}}, do: build, what: Pylon}
# Started while Warpgate research is still in flight (baseline: 0 Warpgates), so it
# completes via our manual morph (modern) OR the research-complete auto-morph (4.10).
- {at: {count: {Gateway: 1}}, do: morph, to: warpgate, count: 1}
- {at: {count: {WarpGate: 1}}, do: warp, what: Zealot, where: main}
- {at: {time: 250}, do: wait}  # keep alive until the Zealot warps in
