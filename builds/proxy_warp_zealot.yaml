# Proxy Warpgate Zealot pressure (illustrative) — demonstrates the proxy +
# warp-in features and the named-probe mechanic, not a tuned pro build.
#
# Idea: one probe scouts the enemy, then stays out and lays a proxy Pylon on the
# enemy's doorstep; meanwhile we tech to Warpgate at home, morph, and warp Zealots
# straight in at the proxy.
#
# Mechanics shown here:
#   * send_probe {where, who}    -> pull a probe and send it somewhere, naming it.
#     Re-sending the same name moves the SAME probe (here: scout the enemy main
#     first, then move that probe out to the proxy). Sent probes are held out of
#     mining/auto-build until a return_probe hands them back.
#   * build ... who: scout       -> build with that specific probe (the scout lays
#     the proxy Pylon) instead of auto-pulling a fresh one.
#   * return_probe {who}         -> give the probe back to the economy.
#   * morph to: warpgate         -> explicitly convert Gateways to Warpgates.
#   * warp ... where: proxy      -> warp a unit in at the proxy Pylon.
#
# Schema defined + validated in schema.py.

- {at: {time: 7},     do: chrono, target: Nexus}  # 1st chrono on probes
- {at: {supply: 12},  do: build,  what: Pylon,   prewalk: {minerals: 75}}  # home Pylon=100
- {at: {supply: 12},  do: send_probe, where: enemy_main, who: scout}  # scout the enemy with a named probe
- {at: {supply: 13},  do: build,  what: Gateway, prewalk: {minerals: 100}}  # Gateway=150
- {at: {supply: 14},  do: build,  what: Assimilator}  # gas for Warpgate research
- {at: {count: {Assimilator: 1}}, do: set_gas_probes, count: 3}  # saturate the gas
- {at: {supply: 15},  do: build,  what: Gateway, prewalk: {minerals: 100}}  # 2nd Gateway
# Send the scout out to the proxy EARLY, reusing the same probe that scouted the
# enemy main — a real cross-map send is its own build-order step, so it's in
# position long before we need it (rather than fudged a few seconds by prewalk).
- {at: {supply: 15},  do: send_probe, where: proxy, who: scout}  # scout probe out to the proxy (early)
- {at: {count: {Gateway: 1}}, do: build, what: CyberneticsCore, prewalk: {minerals: 100}}  # Core=150
- {at: {count: {CyberneticsCore: 1}}, do: research, what: Warpgate}
- {at: {count: {CyberneticsCore: 1}}, do: chrono,   target: CyberneticsCore}  # chrono Warpgate research
# Cap probes so the proxy Pylon's supply goes to the Zealot wave, not more probes.
- {at: {supply: 18},  do: cut_probes}  # all-in
# The scout is already forward, so the Pylon goes up without a cross-map walk.
- {at: {supply: 18},  do: build, what: Pylon, where: proxy, who: scout}  # scout builds the proxy Pylon
- {at: {supply: 18},  do: return_probe, who: scout}  # scout back to mining (or drop this to leave it hidden out there)
# Switch both Gateways to Warpgates (holds until research is done + they convert).
- {at: {supply: 18},  do: morph, to: warpgate, count: 2}  # convert both Gateways -> Warpgates
# Warp a wave of Zealots in at the proxy Pylon (holds until all 4 have landed).
- {at: {supply: 18},  do: warp, what: Zealot, where: proxy, count: 4}
- {at: {supply: 18},  do: set_rally_point, where: proxy}  # rally reinforcements to the proxy
